<div class="grid gap-6 lg:grid-cols-2">
  <article
    class="flex flex-col rounded-2xl border border-surface-700 bg-surface-900/60 p-5 shadow-lg shadow-black/20"
  >
    <div class="mb-4 flex flex-wrap items-end justify-between gap-2">
      <div>
        <h2 class="font-display text-lg font-semibold text-white">Ingresos por mes</h2>
        <p class="mt-1 text-xs text-slate-500">Últimos 6 meses · barras</p>
      </div>
      <span class="rounded-lg bg-surface-800 px-2 py-1 text-xs font-medium text-brand-300">Ejemplo</span>
    </div>
    <div class="relative h-72 w-full min-h-[18rem]">
      <canvas #barCanvas></canvas>
    </div>
  </article>

  <article
    class="flex flex-col rounded-2xl border border-surface-700 bg-surface-900/60 p-5 shadow-lg shadow-black/20"
  >
    <div class="mb-4 flex flex-wrap items-end justify-between gap-2">
      <div>
        <h2 class="font-display text-lg font-semibold text-white">Tendencia</h2>
        <p class="mt-1 text-xs text-slate-500">Misma serie · línea con área</p>
      </div>
      <p class="text-right">
        <span class="block text-[10px] uppercase tracking-wide text-slate-500">Total 6 meses</span>
        <span class="font-display text-lg font-bold text-accent-300">{{ totalFormatted() }}</span>
      </p>
    </div>
    <div class="relative h-72 w-full min-h-[18rem]">
      <canvas #lineCanvas></canvas>
    </div>
  </article>
</div>
